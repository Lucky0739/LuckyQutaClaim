spring:
  application:
    name: lucky-seckill-cart
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:lucky-seckill-dev.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        file-extension: yml
        import-check:
          enabled: false

server:
  port: 8092
  forward-headers-strategy: framework

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: lucky_seckill_tx_group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      lucky_seckill_tx_group: default
    grouplist:
      default: 127.0.0.1:8091

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


management:
  endpoints:
    web:
      exposure:
        include: '*'

sa-token:
  ignore-paths: /user/login,/user/register,/user/send-verify-code,/cart/count