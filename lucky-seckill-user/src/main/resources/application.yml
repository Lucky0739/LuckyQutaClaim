spring:
  application:
    name: lucky-seckill-user
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:lucky-seckill-dev.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        ip: 127.0.0.1
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        file-extension: yml

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: '*'

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  ignore-paths: /user/login,/user/register,/user/code/send,/captcha/**

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: merchant-apply-producer
    send-message-timeout: 3000

captcha:
  prefix: captcha
  expire:
    default: 1000000
    WORD_IMAGE_CLICK: 2000000
  secondary:
    enabled: true
    expire: 120000
    keyPrefix: "captcha:secondary"
  init-default-resource: true
  local-cache-enabled: true
  local-cache-size: 20