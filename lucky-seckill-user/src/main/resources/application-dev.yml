spring:
  # 本地开发环境 MySQL 数据源配置
  datasource:
    # 连接地址：数据库名为 lucky_seckill（1.1 小节中创建的）
    url: jdbc:mysql://localhost:3306/seckill_mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    # 数据库用户名
    username: root
    # 数据库密码
    password: yang2004
    # 数据库驱动类名
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置
    hikari:
      # 连接池名称
      pool-name: SeckillHikariPool
      # 最小空闲连接数
      minimum-idle: 10
      # 最大连接数
      maximum-pool-size: 50
      # 空闲连接超时时间（毫秒）
      idle-timeout: 300000
      # 连接最大存活时间（毫秒）
      max-lifetime: 900000
      # 获取连接超时时间（毫秒）
      connection-timeout: 30000
      # 连接测试语句
      connection-test-query: SELECT 1
  data:
    redis:
        # Redis 服务器地址
        host: 127.0.0.1
        # Redis 服务器端口
        port: 6379
        # Redis 密码（默认为空，如果设置了密码请填写）
        password: yang2004
        # 使用的数据库索引（默认 0）
        database: 0
        # 连接超时时间（毫秒）
        timeout: 5000
        # Lettuce 连接池配置（提升连接复用效率）
        lettuce:
          pool:
            # 连接池最大连接数
            max-active: 20
            # 连接池最大空闲连接数
            max-idle: 10
            # 连接池最小空闲连接数
            min-idle: 5
            # 连接池最大阻塞等待时间（毫秒），-1 表示无限制
            max-wait: 3000

# MyBatis 开发环境专属配置
mybatis:
  configuration:
    # 开发阶段打印 SQL 语句，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # 指定 Mapper XML 文件的位置
  mapper-locations: classpath:mapper/*.xml

# 阿里云号码认证 PNVS（短信认证）配置
aliyun:
  pnvs:
    # AccessKey ID（从阿里云控制台获取）
    access-key-id: LTAI5tAnQ1MZM1gyaW7ZaeeL
    # AccessKey Secret（从阿里云控制台获取）
    access-key-secret: nSF2QjhvrXSbvUy0po9pOrWUzhh69U
    # PNVS 控制台赠送或配置的短信签名名称
    sign-name: 速通互联验证码
    # PNVS 短信认证模板 Code
    template-code: 100001
    # 可选：PNVS 方案名称，不填则使用默认方案
    scheme-name:
    # PNVS 服务地域和访问域名
    region-id: cn-hangzhou
    endpoint: dypnsapi.aliyuncs.com
    # 验证码有效期和频控间隔（单位：秒）
    valid-time: 300
    interval: 60
    # 验证码长度（4~8 位）和生成类型
    code-length: 6
    code-type: 1
    # 使用本地生成的验证码，不要求接口返回验证码
    return-verify-code: false