spring:
  application:
    name: lucky-seckill-order
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:lucky-seckill-dev.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8719
      eager: true

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: lucky_seckill_tx_group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      lucky_seckill_tx_group: default
    grouplist:
      default: 127.0.0.1:8091

server:
  port: 8084
  forward-headers-strategy: framework

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: '*'

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: order-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

sa-token:
  ignore-paths: /user/login,/user/register,/user/send-verify-code,/order/**,/actuator/**
  jackson:
    date-format: yyyy-M-d HH:mm:ss
    time-zone: GMT+8