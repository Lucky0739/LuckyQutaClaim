spring:
  application:
    name: lucky-seckill-order
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:lucky-seckill-dev.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
        import-check:
          enabled: false

server:
  port: 8084
  forward-headers-strategy: framework

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: '*'

sa-token:
  ignore-paths: /user/login,/user/register,/user/send-verify-code,/order/**,/actuator/**
  jackson:
    date-format: yyyy-M-d HH:mm:ss
    time-zone: GMT+8