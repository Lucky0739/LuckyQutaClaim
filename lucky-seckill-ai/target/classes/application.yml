spring:
  application:
    name: lucky-seckill-ai
  profiles:
    active: dev
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-434aff7df6974f13b31c6ec208339963}
      base-url: https://dashscope.aliyuncs.com
      chat:
        options:
          model: qwen3.7-max
      embedding:
        options:
          model: text-embedding-v3
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        file-extension: yml
        import-check:
          enabled: false

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: lucky_seckill_tx_group
  enable-auto-data-source-proxy: false
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      lucky_seckill_tx_group: default
    grouplist:
      default: 127.0.0.1:8091

server:
  port: 8090

lucky-seckill:
  ai:
    chat-memory:
      # 滑动窗口：最多保留的消息条数（约 10 轮问答）
      max-messages: 20
      # Redis 会话记忆过期时间（小时）
      expire-hours: 24
    vector-store:
      pgvector:
        host: ${PGVECTOR_HOST:127.0.0.1}
        port: ${PGVECTOR_PORT:5432}
        database: ${PGVECTOR_DATABASE:seckill_mall_vectordb}
        username: ${PGVECTOR_USERNAME:postgres}
        password: ${PGVECTOR_PASSWORD:yang2004.}
        table-name: ai_knowledge_base
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

logging:
  level:
    root: INFO
    com.lucky.seckill.ai: DEBUG