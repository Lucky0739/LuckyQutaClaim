spring:
  application:
    name: lucky-seckill-notify
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:lucky-seckill-dev.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        file-extension: yml
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/seckill_mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: yang2004
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: SeckillHikariPool
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 300000
      max-lifetime: 900000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: yang2004
      database: 0
      timeout: 5000

server:
  port: 8086
  forward-headers-strategy: framework

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: '*'

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: shop-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  ignore-paths: /user/login,/user/register,/user/code/send,/captcha/**