spring:
  application:
    name: lucky-seckill-pay
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:lucky-seckill-dev.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        metadata:
          preserved.heart.beat.interval: 5000
          preserved.heart.beat.timeout: 15000
          preserved.ip.delete.timeout: 30000
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
        import-check:
          enabled: false
    loadbalancer:
      ribbon:
        enabled: false
      eager-load:
        clients:
          - lucky-seckill-order
          - lucky-seckill-goods
          - lucky-seckill-notify
      cache:
        enabled: true
        ttl: 5s
        capacity: 256

server:
  port: 8086
  forward-headers-strategy: framework

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: lucky_seckill_tx_group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      lucky_seckill_tx_group: default
    grouplist:
      default: 127.0.0.1:8091

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: '*'

# Feign 客户端配置
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
  httpclient:
    hc5:
      enabled: true

# 支付宝沙箱配置
alipay:
  # 沙箱AppID（开放平台沙箱环境复制）
  app-id: 9021000163696066
  # 沙箱网关（固定写死）
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  # 应用私钥（沙箱助手生成，保留完整头尾和换行）
  merchant-private-key: 
  # 支付宝公钥（沙箱页面复制，保留完整头尾和换行）
  alipay-public-key: 
  # 签名类型（固定RSA2）
  sign-type: RSA2
  charset: UTF-8
  format: JSON
  # 异步通知地址（必须公网可访问，用ngrok穿透）
  notify-url: https://donator-smith-gumdrop.ngrok-free.dev/pay/notify
  # 支付成功后，支付宝同步跳回的前端页面
  return-url: http://localhost:5173/pay/result
  config:
    # 连接超时时间
    connectTimeout: 10000
    # 读取超时时间
    readTimeout: 15000
sa-token:
  ignore-paths: /user/login,/user/register,/user/send-verify-code,/pay/**,/order/**,/goods/**,/notify/**,/actuator/**